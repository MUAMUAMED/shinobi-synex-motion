  <script>
    (function () {
      const S = 0, tl = gsap.timeline({ paused: true }), c = { xPercent: -50, yPercent: -50 }, f = 1 / 30;
      // Ritmo da referência: cada palavra é um quadro, o fundo alterna e acelera com a fala
      L.batida(tl, S, [
        { sel: "#a-q0", t: 0, deriva: { scale: 1.05 } },
        { sel: "#a-q1", t: W[1] - 0.02, deriva: { scale: 1.08, rotation: -1.5 } },
        { sel: "#a-q2", t: W[4] - 0.02, deriva: { scale: 1.07 } },
        { sel: "#a-q3", t: W[5] - 0.02, deriva: { scale: 1.1, rotation: 1.5 } },
        { sel: "#a-q4", t: W[7] - 0.02, deriva: { scale: 1.08 } },
        { sel: "#a-q5", t: W[8] - 0.02, deriva: { scale: 1.07, rotation: -1 } },
        { sel: "#a-q6", t: W[10] - 0.02, deriva: { scale: 1.1 } },
        { sel: "#a-q7", t: W[12] - 0.02, deriva: { scale: 0.86 } },
        { sel: "#a-q8", t: W[14] - 0.02, deriva: { scale: 1.12, rotation: -4 } },
        { sel: "#a-q9", t: W[15] - 0.02, deriva: { scale: 1.06 } },
        { sel: "#a-q10", t: W[17] - 0.02, deriva: { scale: 1.08 }, de: 1.4 },
      ], 7.3);

      // Sério... a chibi entra e balança de leve, o texto chega com a palavra
      L.k(tl, "#a-chibi", S, [[0.02, { ...c, x: 470, y: 600, scale: 1.25, rotation: -6, opacity: 0, filter: "blur(14px)" }], [0.05, { opacity: 1 }], [0.4, { y: 560, scale: 1, rotation: 2, filter: "blur(0px)" }, "expo.out"], [0.92, { y: 548, rotation: -1 }, "sine.inOut"]]);
      gsap.set("#a-serio", { ...c, x: 1290, y: 530 });
      L.pop(tl, "#a-serio", S, W[0], 1.35);
      L.vivo(tl, "#a-serio", S, W[0] + 0.12, 0.93, { x: 1290 }, { x: 1250 });
      [["#a-p1", 0.44], ["#a-p2", 0.56], ["#a-p3", 0.68]].forEach(([s, t]) => L.carimbo(tl, s, S, t));

      // tá todo MUNDO

      // cansado: cada letra cai um pouco, como quem perdeu a força
      const r = L.rng(4);
      L.letras(document.getElementById("a-cansado")).forEach((s, i) => {
        tl.fromTo(s, { y: 0, rotation: 0 }, { y: 18 + r() * 40, rotation: (r() - 0.5) * 26, duration: 0.42, ease: "power2.in", immediateRender: false }, W[4] + 0.08 + i * 0.02 - S);
      });
      // daqueles RPs, com ecos
      L.pop(tl, "#a-w5", S, W[5]); L.pop(tl, "#a-w6", S, W[6], 1.5);
      L.ecos(tl, ["#a-e1", "#a-e2", "#a-e3"], S, W[6] + 0.04, 0.42);
      // genéricos: faixas correndo
      L.vivo(tl, "#a-f1", S, W[7] - 0.02, W[8], { x: 0 }, { x: -420 });
      L.vivo(tl, "#a-f2", S, W[7] - 0.02, W[8], { x: -420 }, { x: 0 });
      // de Naruto
      L.pop(tl, "#a-w8", S, W[8]); L.pop(tl, "#a-w9", S, W[9], 1.4);
      // são SEMPRE
      L.pop(tl, "#a-w10", S, W[10]); L.pop(tl, "#a-w11", S, W[11], 1.5);
      L.ecos(tl, ["#a-e4", "#a-e5"], S, W[11] + 0.04, 0.4);

      // as mesmas: uma palavra vira 25 cópias, do centro para fora
      const grade = document.getElementById("a-grade"), copias = [];
      for (let y = -2; y <= 2; y++) for (let x = -2; x <= 2; x++) {
        const s = document.createElement("span");
        s.textContent = x === 0 && y === 0 ? "as mesmas" : "mesmas";
        s.style.left = x * 520 + "px"; s.style.top = y * 215 + "px";
        if ((x + y) % 2 === 0 && !(x === 0 && y === 0)) s.style.color = "#ff2b3a";
        grade.appendChild(s); copias.push({ s, d: Math.hypot(x, y) });
      }
      copias.forEach(({ s, d }) => {
        const t = d === 0 ? W[12] : W[13] + d * 0.06;
        gsap.set(s, { opacity: 0 });
        tl.fromTo(s, { opacity: 1, scale: 1.4, filter: "blur(5px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.12, ease: "expo.out", immediateRender: false }, t - S);
      });
      // coisas: faixas em sentidos alternados
      for (let i = 0; i < 6; i++) L.vivo(tl, "#a-c" + i, S, W[14] - 0.02, W[15], { x: i % 2 ? -700 : 0 }, { x: i % 2 ? 0 : -700 });
      // e nenhuma
      L.pop(tl, "#a-w15", S, W[15]); L.pop(tl, "#a-w16", S, W[16], 1.4);
      // inovação! riscada à mão, câmera treme
      L.k(tl, "#a-rp", S, [[6.4, { strokeDasharray: 1, strokeDashoffset: 1 }], [6.56, { strokeDashoffset: 0 }, "power2.out"]]);
      L.treme(tl, "#a-tudo", S, 6.5, 16, 6);
      // Glitch de 4 quadros e implosão até o ponto vermelho
      [["#a-g1", 6.72], ["#a-g2", 6.72 + f], ["#a-g3", 6.72 + 2 * f], ["#a-g4", 6.72 + 3 * f], ["#a-g2", 6.72 + 3 * f]].forEach(([s, t]) => L.mostra(tl, s, S, t, t + f));
      gsap.set("#a-g2", { opacity: 0 });
      tl.to("#a-tudo", { scale: 0.02, opacity: 0.4, duration: 0.24, ease: "power3.in", immediateRender: false, transformOrigin: "50% 50%" }, 6.86);
      L.k(tl, "#a-ponto", S, [[6.99, { ...c, x: 960, y: 540, scale: 0, opacity: 1 }], [7.08, { scale: 1 }, "back.out(2)"]]);
